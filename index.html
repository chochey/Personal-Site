<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <div class="time-container">
                <div class="time" id="time"></div>
                <div class="date" id="date"></div>
            </div>
            <div class="greeting" id="greeting"></div>
            <button class="widget-menu-btn bg-settings-btn" id="bgSettingsBtn" title="Background Settings">🎨</button>
            <button class="widget-menu-btn" id="widgetMenuBtn" title="Restore Widgets">⚙️</button>
        </header>

        <!-- Widget Menu -->
        <div class="widget-menu" id="widgetMenu">
            <div class="widget-menu-content">
                <h3>Restore Widgets</h3>
                <div class="widget-menu-list" id="widgetMenuList"></div>
            </div>
        </div>

        <!-- Quick Search Modal -->
        <div class="search-modal" id="searchModal">
            <div class="search-modal-content">
                <input type="text" id="searchInput" class="search-input" placeholder="Search sites, todos, notes... (Ctrl+K)">
                <div class="search-results" id="searchResults"></div>
            </div>
        </div>

        <!-- Background Customization Panel -->
        <div class="bg-panel" id="bgPanel">
            <div class="bg-panel-content">
                <h3>Background Settings</h3>
                <div class="bg-option">
                    <label>Background Type:</label>
                    <select id="bgType" class="bg-select">
                        <option value="gradient">Gradient (Default)</option>
                        <option value="image">Custom Image</option>
                        <option value="solid">Solid Color</option>
                    </select>
                </div>
                <div class="bg-option" id="gradientOptions">
                    <label>Gradient Preset:</label>
                    <select id="gradientPreset" class="bg-select">
                        <option value="default">Dark Blue</option>
                        <option value="ocean">Ocean</option>
                        <option value="sunset">Sunset</option>
                        <option value="forest">Forest</option>
                        <option value="purple">Purple Haze</option>
                        <option value="fire">Fire</option>
                    </select>
                </div>
                <div class="bg-option" id="imageOptions" style="display:none;">
                    <label>Image URL:</label>
                    <input type="text" id="bgImageUrl" class="input" placeholder="https://example.com/image.jpg">
                    <button class="btn btn-primary" id="applyImageBtn">Apply Image</button>
                </div>
                <div class="bg-option" id="solidOptions" style="display:none;">
                    <label>Color:</label>
                    <input type="color" id="bgSolidColor" value="#0f0f0f">
                </div>
                <div class="bg-option">
                    <label>Blur: <span id="blurValue">0</span>px</label>
                    <input type="range" id="bgBlur" min="0" max="20" value="0" class="bg-slider">
                </div>
                <div class="bg-option">
                    <label>Opacity: <span id="opacityValue">100</span>%</label>
                    <input type="range" id="bgOpacity" min="50" max="100" value="100" class="bg-slider">
                </div>
                <button class="btn btn-secondary" id="resetBgBtn">Reset to Default</button>
            </div>
        </div>

        <!-- Widget Bar (Right Side) -->
        <div class="widget-bar">
            <button class="widget-bar-btn new-widget-btn" id="newWidgetBtn" title="Create New Widget">+</button>
            <div class="widget-bar-divider"></div>
            <div class="widget-bar-items" id="widgetBarItems"></div>
        </div>

        <!-- New Widget Menu -->
        <div class="new-widget-menu" id="newWidgetMenu">
            <div class="new-widget-menu-content">
                <h3>Create New Widget</h3>
                <button class="widget-type-btn" onclick="createNewWidget('sites')">
                    <span class="widget-type-icon">📌</span>
                    <span class="widget-type-name">Pinned Sites</span>
                </button>
                <button class="widget-type-btn" onclick="createNewWidget('todos')">
                    <span class="widget-type-icon">✓</span>
                    <span class="widget-type-name">Todo List</span>
                </button>
                <button class="widget-type-btn" onclick="createNewWidget('notepad')">
                    <span class="widget-type-icon">📝</span>
                    <span class="widget-type-name">Notepad</span>
                </button>
            </div>
        </div>

        <!-- Main Dashboard - Widgets Container -->
        <main class="dashboard">
            <!-- Pinned Websites Widget -->
            <section class="widget" id="widget-sites" data-widget-id="sites">
                <div class="widget-header">
                    <span class="widget-drag-handle">⋮⋮</span>
                    <h2>📌 Pinned Sites</h2>
                    <div class="widget-controls">
                        <button class="btn-add" id="addSiteBtn" title="Add Site">+</button>
                        <button class="widget-btn widget-minimize" title="Minimize">−</button>
                        <button class="widget-btn widget-close" title="Close">×</button>
                    </div>
                </div>
                <div class="widget-content">
                    <div class="sites-grid" id="sitesGrid"></div>
                </div>
                <div class="widget-resize-handle"></div>
            </section>

            <!-- Todo List Widget -->
            <section class="widget" id="widget-todos" data-widget-id="todos">
                <div class="widget-header">
                    <span class="widget-drag-handle">⋮⋮</span>
                    <h2>✓ Todo List</h2>
                    <div class="widget-controls">
                        <button class="widget-btn widget-minimize" title="Minimize">−</button>
                        <button class="widget-btn widget-close" title="Close">×</button>
                    </div>
                </div>
                <div class="widget-content">
                    <div class="todo-input-container">
                        <input type="text" id="todoInput" placeholder="Add a new task..." class="input">
                        <button class="btn btn-primary" id="addTodoBtn">Add</button>
                    </div>
                    <ul class="todo-list" id="todoList"></ul>
                </div>
                <div class="widget-resize-handle"></div>
            </section>

            <!-- Notepad Widget -->
            <section class="widget widget-large" id="widget-notepad" data-widget-id="notepad">
                <div class="widget-header">
                    <span class="widget-drag-handle">⋮⋮</span>
                    <h2>📝 Notepad</h2>
                    <div class="widget-controls">
                        <span class="auto-save" id="saveStatus">Auto-saved</span>
                        <button class="widget-btn widget-minimize" title="Minimize">−</button>
                        <button class="widget-btn widget-close" title="Close">×</button>
                    </div>
                </div>
                <div class="widget-content">
                    <div class="editor-toolbar">
                        <div class="toolbar-group">
                            <button class="toolbar-btn" onclick="formatDoc('bold')" title="Bold (Ctrl+B)"><b>B</b></button>
                            <button class="toolbar-btn" onclick="formatDoc('italic')" title="Italic (Ctrl+I)"><i>I</i></button>
                            <button class="toolbar-btn" onclick="formatDoc('underline')" title="Underline (Ctrl+U)"><u>U</u></button>
                            <button class="toolbar-btn" onclick="formatDoc('strikeThrough')" title="Strikethrough"><s>S</s></button>
                        </div>
                        <div class="toolbar-group">
                            <select class="toolbar-select" onchange="formatDoc('fontSize', this.value); this.selectedIndex=0;" title="Font Size">
                                <option value="" selected disabled>Size</option>
                                <option value="1">Small</option>
                                <option value="3">Normal</option>
                                <option value="5">Large</option>
                                <option value="7">Extra Large</option>
                            </select>
                            <select class="toolbar-select" onchange="formatDoc('formatBlock', this.value); this.selectedIndex=0;" title="Text Style">
                                <option value="" selected disabled>Style</option>
                                <option value="p">Paragraph</option>
                                <option value="h1">Heading 1</option>
                                <option value="h2">Heading 2</option>
                                <option value="h3">Heading 3</option>
                            </select>
                        </div>
                        <div class="toolbar-group">
                            <button class="toolbar-btn" onclick="formatDoc('insertUnorderedList')" title="Bullet List">• List</button>
                            <button class="toolbar-btn" onclick="formatDoc('insertOrderedList')" title="Numbered List">1. List</button>
                        </div>
                        <div class="toolbar-group">
                            <button class="toolbar-btn" onclick="formatDoc('justifyLeft')" title="Align Left">⬅</button>
                            <button class="toolbar-btn" onclick="formatDoc('justifyCenter')" title="Align Center">↔</button>
                            <button class="toolbar-btn" onclick="formatDoc('justifyRight')" title="Align Right">➡</button>
                        </div>
                        <div class="toolbar-group">
                            <button class="toolbar-btn" onclick="formatDoc('removeFormat')" title="Clear Formatting">Clear</button>
                        </div>
                    </div>
                    <div id="notepad" class="notepad" contenteditable="true" data-placeholder="Start typing your notes here..."></div>
                </div>
                <div class="widget-resize-handle"></div>
            </section>
        </main>

        <!-- Add Site Modal -->
        <div class="modal" id="siteModal">
            <div class="modal-content">
                <h3>Add Website</h3>
                <input type="text" id="siteName" placeholder="Name" class="input">
                <input type="url" id="siteUrl" placeholder="https://example.com" class="input">
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="cancelSite">Cancel</button>
                    <button class="btn btn-primary" id="saveSite">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
